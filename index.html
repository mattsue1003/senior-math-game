<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方格子數學遊戲 - 長輩友善版</title>
    <style>
        body {
            font-family: Microsoft JhengHei, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-info {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #444;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }
        
        .cell {
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* 使格子保持正方形 */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #fff;
            border: 3px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .cell-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .cell:hover {
            background-color: #e8f4fd;
        }
        
        .cell.edge {
            background-color: #f0f5fa;
            border-color: #4a90e2;
            color: #2c3e50;
        }
        
        .cell.clickable {
            background-color: #ffffff;
            border-color: #ccc;
        }
        
        .cell.clickable:hover {
            border-color: #4a90e2;
            background-color: #e8f4fd;
        }
        
        .cell.correct {
            background-color: #e6f7e6;
            border-color: #4caf50;
            color: #2e7d32;
        }
        
        .cell.incorrect {
            background-color: #fdeded;
            border-color: #f44336;
            color: #c62828;
        }
        
        .cell.revealed {
            background-color: #fff3e0;
            border-color: #ff9800;
            color: #e65100;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        button {
            padding: 15px 20px;
            font-size: 18px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        button:hover {
            background-color: #357abd;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        button.secondary {
            background-color: #f39c12;
        }
        
        button.secondary:hover {
            background-color: #d68910;
        }
        
        .difficulty-buttons {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap; /* 允許在小屏幕上換行 */
            width: 90%;
            max-width: 600px;
        }
        
        .difficulty-btn {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 8px;
            white-space: nowrap; /* 防止文字換行 */
            min-width: 90px; /* 給按鈕一個最小寬度 */
            text-align: center;
        }
        
        .difficulty-btn.active {
            background-color: #4a90e2;
            color: white;
            border-color: #357abd;
        }
        
        .score-display {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        
        .instructions {
            max-width: 600px;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            line-height: 1.6;
        }
        
        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .mode-selector {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 90%;
            max-width: 600px;
        }
        
        .mode-btn {
            padding: 12px 20px;
            font-size: 18px;
            background-color: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            min-width: 120px;
            text-align: center;
        }
        
        .mode-btn.active {
            background-color: #4a90e2;
            color: white;
            border-color: #357abd;
        }
        
        .number-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            font-family: Microsoft JhengHei, Arial, sans-serif;
            outline: none;
            border-radius: 10px;
            padding: 0;
            box-sizing: border-box;
            z-index: 2;
        }
        
        .cell.clickable .number-input {
            cursor: pointer;
        }
        
        /* 遮罩和彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 85%;
            width: 400px;
            transform: translateY(-20px);
            transition: transform 0.3s;
            position: relative;
        }
        
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        
        .modal h3 {
            color: #2c3e50;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        
        .modal p {
            font-size: 1.2em;
            margin-bottom: 25px;
            color: #34495e;
            line-height: 1.6;
        }
        
        .modal button {
            padding: 12px 25px;
            margin: 0 10px;
        }
        
        .modal .motivation {
            font-style: italic;
            color: #7f8c8d;
            margin-top: 15px;
        }
        
        .modal .score-highlight {
            font-size: 1.5em;
            font-weight: bold;
            color: #3498db;
            margin: 10px 0;
        }
        
        /* 響應式設計 */
        @media (max-width: 480px) {
            .cell .number-input {
                font-size: 18px;
            }
            
            .cell {
                font-size: 18px;
            }
            
            .grid {
                padding: 10px;
                gap: 5px;
            }
            
            button {
                padding: 12px 15px;
                font-size: 16px;
            }
            
            .difficulty-btn {
                padding: 8px 12px;
                font-size: 14px;
                min-width: 80px;
            }
            
            .mode-btn {
                padding: 10px 15px;
                font-size: 16px;
                min-width: 100px;
            }
            
            .score-display {
                font-size: 18px;
            }
            
            .modal {
                padding: 20px;
            }
            
            .modal h3 {
                font-size: 1.3em;
            }
            
            .modal p {
                font-size: 1.1em;
            }
        }
        
        /* 極小屏幕適配 */
        @media (max-width: 350px) {
            .cell .number-input {
                font-size: 16px;
            }
            
            .cell {
                font-size: 16px;
            }
            
            .grid {
                padding: 5px;
                gap: 3px;
            }
        }
    </style>
</head>
<body>
    <h1>方格子數學遊戲</h1>
    
    <div class="mode-selector">
        <button class="mode-btn active" onclick="changeMode('addition')">加法練習</button>
        <button class="mode-btn" onclick="changeMode('multiplication')">乘法練習</button>
    </div>
    
    <div class="difficulty-buttons">
        <button class="difficulty-btn active" onclick="setDifficulty('easy')">簡單 (1-5)</button>
        <button class="difficulty-btn" onclick="setDifficulty('medium')">中等 (1-10)</button>
        <button class="difficulty-btn" onclick="setDifficulty('hard')">困難 (1-20)</button>
    </div>
    
    <div class="game-info" id="gameInfo">點擊空格填入答案</div>
    
    <div class="grid" id="grid"></div>
    
    <div class="score-display" id="scoreDisplay">得分: 0 / 總題數: 0</div>
    
    <div class="controls">
        <button onclick="startGame()">開始新遊戲</button>
        <button onclick="checkAnswers()">檢查答案</button>
        <button class="secondary" onclick="revealAnswer()">顯示答案</button>
    </div>
    
    <div class="instructions">
        <h3>遊戲說明：</h3>
        <ul>
            <li>選擇練習模式：加法或乘法</li>
            <li>選擇難度：簡單、中等或困難</li>
            <li>頂行和首列有數字，計算它們的加法或乘法結果</li>
            <li>點擊空白格子，直接輸入答案</li>
            <li>填完後點擊「檢查答案」查看結果</li>
            <li>如需幫助，可點擊「顯示答案」</li>
        </ul>
    </div>
    
    <!-- 結果彈窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <h3 id="modalTitle">做得好！</h3>
            <p id="modalMessage">您已完成本輪練習。</p>
            <div class="score-highlight" id="modalScore">得分: 8 / 16</div>
            <p class="motivation" id="modalMotivation">每天練習，腦筋更靈活！</p>
            <button onclick="startNewGame()">再來一輪</button>
        </div>
    </div>

    <script>
        let currentMode = 'addition';
        let currentDifficulty = 'easy';
        let score = 0;
        let totalCells = 0;
        let gridData = [];
        let answersChecked = false;
        
        // 鼓勵訊息列表
        const motivationMessages = [
            "每天練習，腦筋更靈活！",
            "您做得很棒！持續練習是進步的關鍵。",
            "慢慢來，數學能力需要時間培養。",
            "練習使人進步，明天再來挑戰吧！",
            "腦力激盪，健康長壽！",
            "沒關係，重要的是動腦思考的過程。",
            "下次一定能做得更好！",
            "恭喜您完成練習，您離目標更近了一步！",
            "持之以恆，您將會越來越厲害！",
            "動腦思考是保持大腦年輕的秘訣！"
        ];
        
        function changeMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) event.target.classList.add('active');
            startGame();
        }
        
        function setDifficulty(difficulty) {
            currentDifficulty = difficulty;
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) event.target.classList.add('active');
            startGame();
        }
        
        function getRandomNumber() {
            switch(currentDifficulty) {
                case 'easy':
                    return Math.floor(Math.random() * 5) + 1;
                case 'medium':
                    return Math.floor(Math.random() * 10) + 1;
                case 'hard':
                    return Math.floor(Math.random() * 20) + 1;
                default:
                    return Math.floor(Math.random() * 5) + 1;
            }
        }
        
        function calculateAnswer(num1, num2) {
            if (currentMode === 'addition') {
                return num1 + num2;
            } else {
                return num1 * num2;
            }
        }
        
        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            gridData = [];
            answersChecked = false;
            
            // Generate random numbers for top row and first column
            const topNumbers = [];
            const leftNumbers = [];
            
            for (let i = 0; i < 5; i++) {
                topNumbers.push(getRandomNumber());
                leftNumbers.push(getRandomNumber());
            }
            
            // Create 5x5 grid
            for (let row = 0; row < 5; row++) {
                gridData[row] = [];
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    // 創建內容容器
                    const cellContent = document.createElement('div');
                    cellContent.className = 'cell-content';
                    
                    if (row === 0 && col === 0) {
                        cellContent.textContent = currentMode === 'addition' ? '+' : '×';
                        cell.classList.add('edge');
                    } else if (row === 0) {
                        cellContent.textContent = topNumbers[col - 1];
                        cell.classList.add('edge');
                    } else if (col === 0) {
                        cellContent.textContent = leftNumbers[row - 1];
                        cell.classList.add('edge');
                    } else {
                        const answer = calculateAnswer(leftNumbers[row - 1], topNumbers[col - 1]);
                        gridData[row][col] = answer;
                        
                        cell.classList.add('clickable');
                        
                        // 創建輸入框
                        const input = document.createElement('input');
                        input.type = 'tel'; // 使用tel類型以在手機上顯示數字鍵盤
                        input.maxLength = 3;
                        input.className = 'number-input';
                        input.setAttribute('inputmode', 'numeric');
                        input.setAttribute('pattern', '[0-9]*');
                        
                        // 輸入框聚焦時選中所有內容
                        input.addEventListener('focus', function() {
                            this.select();
                        });
                        
                        // 輸入時檢查是否為數字
                        input.addEventListener('input', function() {
                            this.value = this.value.replace(/[^0-9]/g, '');
                        });
                        
                        cell.appendChild(input);
                    }
                    
                    cell.appendChild(cellContent);
                    grid.appendChild(cell);
                }
            }
            
            totalCells = 16; // 4x4 grid of answers
            score = 0;
            updateScore();
        }
        
        function checkAnswers() {
            if (answersChecked) {
                // 如果已經檢查過了，直接顯示結果彈窗
                showResultModal();
                return;
            }
            
            const inputs = document.querySelectorAll('.number-input');
            let filledInputs = 0;
            score = 0;
            
            inputs.forEach((input, index) => {
                if (input.value.trim() !== '') {
                    filledInputs++;
                    
                    // 計算行和列
                    const row = Math.floor(index / 4) + 1; // +1 因為頂行是標題
                    const col = (index % 4) + 1; // +1 因為首列是標題
                    
                    // 檢查答案
                    const userAnswer = parseInt(input.value);
                    const correctAnswer = gridData[row][col];
                    const cell = input.parentNode;
                    
                    if (userAnswer === correctAnswer) {
                        cell.classList.add('correct');
                        score++;
                    } else {
                        cell.classList.add('incorrect');
                    }
                }
            });
            
            if (filledInputs === 0) {
                alert('請先在空格中填入答案！');
                return;
            }
            
            // 更新得分
            updateScore();
            
            // 標記已檢查
            answersChecked = true;
            
            // 顯示結果彈窗
            showResultModal();
        }
        
        function revealAnswer() {
            if (!answersChecked) {
                const cells = document.querySelectorAll('.cell.clickable');
                let revealedCount = 0;
                
                for (let cell of cells) {
                    const input = cell.querySelector('.number-input');
                    
                    // 如果這個格子是空的
                    if (input.value.trim() === '') {
                        const idx = Array.from(cells).indexOf(cell);
                        const row = Math.floor(idx / 4) + 1;
                        const col = (idx % 4) + 1;
                        
                        input.value = gridData[row][col];
                        cell.classList.add('revealed');
                        revealedCount++;
                        
                        if (revealedCount === 1) {
                            break; // 每次只顯示一個答案
                        }
                    }
                }
                
                if (revealedCount === 0) {
                    alert('所有格子都已經填寫！');
                }
            } else {
                // 如果已經檢查過答案，顯示未填或錯誤的答案
                const incorrectCells = document.querySelectorAll('.cell.incorrect');
                const emptyCells = document.querySelectorAll('.cell.clickable:not(.correct):not(.incorrect):not(.revealed)');
                
                if (incorrectCells.length > 0) {
                    // 優先顯示錯誤的答案
                    const cell = incorrectCells[0];
                    const input = cell.querySelector('.number-input');
                    const idx = Array.from(document.querySelectorAll('.cell.clickable')).indexOf(cell);
                    const row = Math.floor(idx / 4) + 1;
                    const col = (idx % 4) + 1;
                    
                    input.value = gridData[row][col];
                    cell.classList.remove('incorrect');
                    cell.classList.add('revealed');
                } else if (emptyCells.length > 0) {
                    // 如果沒有錯誤的，顯示未填的
                    const cell = emptyCells[0];
                    const input = cell.querySelector('.number-input');
                    const idx = Array.from(document.querySelectorAll('.cell.clickable')).indexOf(cell);
                    const row = Math.floor(idx / 4) + 1;
                    const col = (idx % 4) + 1;
                    
                    input.value = gridData[row][col];
                    cell.classList.add('revealed');
                } else {
                    alert('所有答案都已經顯示了！');
                }
            }
        }
        
        function updateScore() {
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = `得分: ${score} / 總題數: ${totalCells}`;
        }
        
        function showResultModal() {
            const modal = document.getElementById('resultModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalScore = document.getElementById('modalScore');
            const modalMotivation = document.getElementById('modalMotivation');
            
            // 設置標題和訊息
            if (score === totalCells) {
                modalTitle.textContent = "太棒了！全部答對！";
                modalMessage.textContent = "您的數學能力真是驚人！";
            } else if (score >= totalCells * 0.7) {
                modalTitle.textContent = "做得很好！";
                modalMessage.textContent = "您的數學能力相當不錯！";
            } else if (score >= totalCells * 0.4) {
                modalTitle.textContent = "做得不錯！";
                modalMessage.textContent = "繼續努力，您會越來越進步！";
            } else {
                modalTitle.textContent = "謝謝參與！";
                modalMessage.textContent = "數學需要練習，別放棄！";
            }
            
            // 設置分數
            modalScore.textContent = `得分: ${score} / ${totalCells}`;
            
            // 隨機選擇一句鼓勵訊息
            const randomIndex = Math.floor(Math.random() * motivationMessages.length);
            modalMotivation.textContent = motivationMessages[randomIndex];
            
            // 顯示彈窗
            modal.classList.add('active');
        }
        
        function startNewGame() {
            // 隱藏彈窗
            document.getElementById('resultModal').classList.remove('active');
            
            // 開始新遊戲
            startGame();
        }
        
        function startGame() {
            createGrid();
            const gameInfo = document.getElementById('gameInfo');
            const modeText = currentMode === 'addition' ? '加法' : '乘法';
            gameInfo.textContent = `${modeText}練習已開始 - 點擊空格填入答案`;
        }
        
        // 初始化遊戲
        window.onload = function() {
            startGame();
            
            // 為彈窗外點擊添加關閉功能
            document.getElementById('resultModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        };
    </script>
</body>
</html>
